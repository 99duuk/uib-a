<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI Before / After</title><style>__CSS__</style></head>
<body>
<header class="top"><div><span class="eyebrow">UIB-A · DESIGN REVIEW</span><h1 id="project-title">Before / After</h1><p>요소를 선택하고, 수정할 내용을 복사해 전달하세요.</p></div><button id="download-index">요소 목록 저장</button></header>
<main>
<section class="toolbar" aria-label="검토 도구">
 <label>화면 그룹<select id="group"></select></label><label>화면<select id="screen"></select></label><label>상태<select id="state"></select></label><label>크기<select id="viewport"></select></label><label>시안<select id="variant"></select></label>
 <label>비교<select id="comparison"><option value="both">나란히</option><option value="before">Before만</option><option value="after">After만</option></select></label>
 <label>배율<select id="zoom"><option value="fit">영역에 맞춤</option><option value="actual">100%</option></select></label>
 <label>모드<select id="interaction"><option value="review">요소 검토</option><option value="experience">로컬 체험</option></select></label>
</section>
<p class="context" id="entry-context"></p>
<div class="comparison" id="panels">
 <section class="panel" id="before-panel"><div class="panel-heading"><div><b>BEFORE</b><span id="before-kind"></span></div><label>구간<select id="tile"></select></label></div><div class="stage"><div class="frame-wrap"><iframe id="before-frame" title="현재 화면" sandbox="allow-scripts"></iframe></div></div></section>
 <section class="panel" id="after-panel"><div class="panel-heading"><div><b class="after-label">AFTER</b><span id="after-revision"></span></div><label><input id="expand" type="checkbox">설명 펼치기</label></div><div class="stage"><div class="frame-wrap"><iframe id="after-frame" title="개선 시안" sandbox="allow-scripts"></iframe></div></div></section>
</div>
<details class="notes"><summary>브랜드 · 디자인 근거 · 검토 범위</summary><div id="notes"></div></details>
</main>
<section class="selection" aria-label="선택한 요소">
 <div class="selection-head"><strong id="selected-title">화면 안의 요소를 선택해 주세요</strong><span id="status" role="status" aria-live="polite">클릭·터치 또는 요소 목록으로 선택할 수 있어요.</span></div>
 <div class="selection-tools"><label>요소 목록<select id="element-picker"><option value="">요소 선택</option></select></label><button id="previous-element">이전 요소</button><button id="next-element">다음 요소</button></div>
 <div class="copy-row"><textarea id="selection-text" readonly aria-label="복사할 요소 정보"></textarea><button id="copy" disabled>다시 복사</button></div>
 <div id="ancestors" class="ancestors"></div>
 <div class="edit-tools"><button id="remove" disabled>임시로 지우기</button><button id="undo" disabled>되돌리기</button><button id="copy-deletions" disabled>삭제 목록 복사</button><button id="restore" disabled>모두 복원</button><button id="save">삭제 반영본 저장</button><small>저장 전 변경은 임시 · 새로고침하면 복원</small></div>
 <details class="deletion-log"><summary id="deletion-summary">삭제 목록 · 0개</summary><p>After는 배치에서 제거 · Before는 이미지 영역 가리기</p><ul id="deleted-list"></ul></details>
</section>
<script type="application/json" id="uib-payload">__PAYLOAD__</script>
<script type="application/json" id="uib-state">__STATE__</script>
<script>__JS__</script>
</body></html>
