<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI Before / After</title><style>__CSS__</style></head>
<body data-ui-mode="compare">
<header class="top"><h1 id="project-title">Before / After</h1><div class="mode-switch" role="group" aria-label="작업 모드"><button id="mode-compare" aria-pressed="true">비교만</button><button id="mode-simple" aria-pressed="false">간편 수정</button><button id="mode-advanced" aria-pressed="false">상세 검토</button></div><div class="save-tools"><small id="save-status">미저장 변경 없음</small><button id="save">검토 파일 저장</button></div></header>
<div class="workspace"><aside class="navigator" id="navigator" aria-label="화면 탐색"><button id="close-navigator">캔버스로 복귀</button><label>화면 검색<input id="screen-search" type="search"></label><label>판정 필터<select id="decision-filter"><option value="all">전체</option><option value="unreviewed">미검토</option><option value="approved">승인</option><option value="needs-review">재검토</option></select></label><span id="progress" role="status"></span><div id="screen-list"></div><button id="next-unreviewed">다음 미검토</button></aside><main>
<section class="entry-tools" aria-label="비교할 화면"><label id="entry-picker-label">화면<select id="entry-picker"></select><span id="single-entry" hidden></span></label><div class="mobile-tabs" role="tablist" aria-label="비교 화면"><button id="before-tab" role="tab">Before</button><button id="after-tab" role="tab">After</button></div><details id="find-element" class="editing-only"><summary>요소 찾기</summary><label>요소 목록<select id="element-picker"><option value="">요소 선택</option></select></label><button id="previous-element">이전 요소</button><button id="next-element">다음 요소</button></details><button id="toggle-navigator" class="advanced-only">화면 목록</button><button id="toggle-inspector" class="editing-only" hidden>검토 도구</button></section>
<p id="mode-help" class="editing-only">화면에서 바꿀 부분을 선택하세요.</p>
<details id="comparison-settings" class="advanced-only"><summary>비교 설정</summary><section class="toolbar" aria-label="비교 설정">
 <label>화면 그룹<select id="group"></select></label><label>화면<select id="screen"></select></label><label>상태<select id="state"></select></label><label>크기<select id="viewport"></select></label><label>시안<select id="variant"></select></label>
 <label>비교<select id="comparison"><option value="both">나란히</option><option value="before">Before만</option><option value="after">After만</option><option value="wipe">슬라이더</option><option value="overlay">투명 겹침</option><option value="diff">픽셀 차이</option></select></label>
 <label>배율<select id="zoom"><option value="fit">영역에 맞춤</option><option value="actual">100%</option></select></label>
 <label>선택 방식<select id="interaction"><option value="review">요소 선택</option><option value="multi">다중 선택</option><option value="region">영역 의견</option><option value="area">영역 요소</option><option value="text">텍스트 의견</option><option value="pan">이동</option><option value="experience">로컬 체험</option></select></label>
 <label title="CSS 애니메이션 정지 · GIF/canvas의 완전 정지 미보장"><input id="freeze" type="checkbox" checked>모션 정지</label><label><input id="show-pins" type="checkbox" checked>의견 핀</label><label title="타일 매핑 우선 · 화면 길이 차이의 비율 동기화는 근사"><input id="sync-scroll" type="checkbox">스크롤 동기화</label><label id="view-state-label" hidden>원본/수정본<select id="view-state"><option value="current">현재 수정 결과</option><option value="original">원본</option></select></label><button id="complete-selection" hidden>선택 완료</button><button id="cancel-selection" hidden>선택 취소</button><button id="screen-target">화면 전체 의견</button>
</section></details>
<div id="raster-view" hidden><label>비교 비율<input id="compare-range" type="range" min="0" max="100" value="50"></label><p id="compare-reason"></p><div id="diff-candidates"></div><div class="raster-stage"><img id="raster-before" alt="Before 원본"><img id="raster-after" alt="After 원본"><img id="raster-diff" alt="픽셀 차이"></div></div>
<p class="context advanced-only" id="entry-context"></p>
<div class="comparison" id="panels">
 <section class="panel" id="before-panel"><div class="panel-heading"><div><b>BEFORE</b><span id="before-kind"></span></div><label id="tile-label" hidden>구간<select id="tile"></select></label></div><div class="stage"><div class="frame-wrap"><iframe id="before-frame" title="현재 화면" sandbox="allow-scripts"></iframe></div></div></section>
 <section class="panel" id="after-panel"><div class="panel-heading"><div><b class="after-label">AFTER</b><span id="after-revision" class="advanced-only"></span><span id="modified-label" hidden>수정 반영</span></div><label class="advanced-only"><input id="expand" type="checkbox">설명 펼치기</label></div><div class="stage"><div class="frame-wrap"><iframe id="after-frame" title="개선 시안" sandbox="allow-scripts"></iframe></div></div></section>
</div>
<details class="notes advanced-only"><summary>브랜드 · 디자인 근거 · 검토 범위</summary><div id="notes"></div></details>
</main>
<section class="selection" id="inspector" aria-label="검토 도구" hidden>
 <button id="close-inspector">닫기</button><div class="selection-head"><strong id="selected-title">바꿀 부분을 선택하세요</strong><span id="status" role="status" aria-live="polite"></span></div>
 <div class="edit-tools"><button id="remove" disabled>임시 삭제</button><button id="undo" disabled>되돌리기</button><button id="redo" disabled>다시 실행</button></div>
 <section id="simple-tools" class="simple-only"><p id="simple-limit"></p><div id="simple-patch-tools"><label>시안 수정<select id="simple-property"><option value="text">문구</option><option value="color">글자색</option><option value="fontSize">글자 크기</option></select></label><label>수정할 값<input id="simple-value" maxlength="10000"></label><button id="apply-simple-patch" disabled>적용</button></div><label>수정 요청<textarea id="simple-comment" maxlength="10000" placeholder="이 부분을 어떻게 바꾸면 좋을까요?"></textarea></label><button id="add-simple-comment">요청 남기기</button><div id="simple-annotations"></div></section>
 <details class="deletion-log"><summary id="deletion-summary">변경 내역 · 0개</summary><p>After 임시 삭제는 배치에서 제거 · Before는 이미지 영역 가리기</p><button id="restore" disabled>모두 복원</button><button id="copy-deletions" class="advanced-only" disabled>삭제 목록 복사</button><ul id="deleted-list"></ul><div id="simple-patch-list" class="simple-only"></div></details>
<section class="review-tools advanced-only">
<details id="element-details"><summary>요소 정보 · 속성 검사 · 시안 수정</summary><div class="copy-row"><textarea id="selection-text" readonly aria-label="복사할 요소 정보"></textarea><button id="copy" disabled>선택 정보 복사</button></div><div id="ancestors" class="ancestors"></div><pre id="property-info"></pre><label>조정 종류<select id="patch-kind"><option value="text">텍스트</option><option value="style">허용 style</option><option value="token">디자인 토큰</option><option value="asset">내장 이미지</option></select></label><label>속성/토큰<select id="patch-property"><option>color</option><option>fontSize</option><option>fontFamily</option><option>margin</option><option>padding</option><option>gap</option><option>textAlign</option><option>justifyContent</option><option>alignItems</option></select></label><label>값<input id="patch-value" maxlength="10000"></label><label>자산<select id="patch-asset"></select></label><button id="apply-patch" disabled>미리보기 조정</button><div id="patch-list"></div></details>
<details id="opinion-tools"><summary>의견</summary><label>표시용 작성자<input id="author" maxlength="100"></label><label>의견<textarea id="comment" maxlength="10000" placeholder="현재 동작 · 요청 · 이유"></textarea></label><label>우선도<select id="priority"><option>P2</option><option>P0</option><option>P1</option><option>P3</option></select></label><button id="add-comment">의견 등록</button><button id="discard-draft">초안 버리기</button><div id="annotations"></div></details>
<details id="decision-tools"><summary>검토 판정</summary><label>판정<select id="decision"><option value="unreviewed">미검토</option><option value="approved">승인</option><option value="changes-requested">수정 요청</option><option value="deferred">보류</option></select></label><label>판정/주요 의견 보류 이유<textarea id="decision-reason" maxlength="10000"></textarea></label><button id="apply-decision">현재 화면 판정</button><p id="decision-status" role="status"></p><details><summary>현재 화면 목록의 일괄 판정</summary><p id="batch-summary"></p><label><input id="batch-confirm" type="checkbox">표시된 화면과 주요 의견 확인</label><button id="batch-decision">현재 목록에 같은 판정 적용</button></details></details>
<details id="file-tools"><summary>파일 및 인계</summary><details><summary>가져오기 · 미해결 연결 <span id="unresolved-count"></span></summary><input id="import-file" type="file" accept="application/json,.json"><div id="import-preview"></div><button id="apply-import" disabled>선택한 변경 가져오기</button><button id="cancel-import">가져오기 취소</button><div id="unresolved-list"></div></details><div class="export-tools"><button id="export-state">검토 JSON</button><button id="export-md">구현 인계 Markdown</button><button id="export-handoff">구현 인계 JSON</button><button id="export-png">원본/선택 PNG</button><button id="export-comparison">원본 비교 PNG</button><button id="export-overlay">의견 포함 PNG</button><button id="download-index">요소 목록 JSON</button></div></details>
</section></section></div>
<script type="application/json" id="uib-payload">__PAYLOAD__</script>
<script type="application/json" id="uib-state">__STATE__</script>
<script>__JS__</script>
</body></html>
