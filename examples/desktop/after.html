<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fieldwork · 브랜드 가이드 검토</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#292c29;--muted:#767b75;--line:#dedfd9;--accent:#345563}
body{margin:0;color:var(--ink);background:#fff;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
button,summary{font:inherit;cursor:pointer}button{color:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.appbar{height:54px;display:flex;align-items:center;gap:32px;padding:0 24px;border-bottom:1px solid var(--line)}
.brand{font-size:17px;font-weight:800;letter-spacing:-.7px}
.app-location{border-left:1px solid var(--line);padding-left:24px;color:#5c635c;font-size:12px}
.workspace{display:grid;grid-template-columns:304px minmax(0,1fr);min-height:calc(100vh - 54px)}
.project-list{border-right:1px solid var(--line);background:#fafaf8;padding:26px 0;display:flex;flex-direction:column}
.list-heading{display:flex;align-items:baseline;gap:8px;padding:0 24px 20px}
.list-heading h1{font-size:14px;margin:0;font-weight:650}
.list-heading span{font-size:11px;color:var(--muted)}
.project{padding:19px 24px;border-top:1px solid #e7e9e3;position:relative}
.project.selected{background:#e8edef}
.project.selected::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent)}
.project-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.project h2{font-size:14px;font-weight:600;margin:0}
.status-mark{width:9px;height:9px;border:1.5px solid #819080;border-radius:50%;flex:none}
.selected .status-mark{background:#9b762e;border-color:#9b762e}
.project-meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:11px;color:#6b7369;font-variant-numeric:tabular-nums;padding-left:17px}
.project-meta .date{margin-left:auto}
.project-task{font-size:12px;margin:12px 0 0 17px;color:#435440}
.overview{margin:30px 24px 0;border-top:1px solid var(--line);padding-top:14px;font-size:11px;color:var(--muted)}
.overview summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:30px}
.overview summary::-webkit-details-marker{display:none}
.overview summary::after{content:"+";font:16px ui-monospace,monospace}
.overview[open] summary::after{content:"−"}
.overview dl{margin:12px 0 0}.overview dl div{display:flex;justify-content:space-between;margin:7px 0}.overview dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
.review{min-width:0;display:flex;flex-direction:column}
.project-header{min-height:105px;padding:25px 32px 19px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}
.project-header h2{font-size:21px;font-weight:650;letter-spacing:-.6px;margin:0 0 7px}
.project-info{display:flex;gap:16px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.project-info b{color:#4a504a;font-weight:500;margin-left:5px}
.review-state{color:#856527;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.review-state::before{content:"";height:7px;width:7px;border-radius:50%;background:#a17c37}
.review-body{display:grid;grid-template-columns:minmax(0,1fr) 224px;flex:1;min-height:0}
.document{background:#edeeeb;min-width:0;display:flex;flex-direction:column}
.document-bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #dde0d8;font-size:12px}
.document-bar span:last-child{color:#7b8378;font-size:11px}
.canvas{flex:1;display:grid;place-items:center;padding:38px 36px 44px}
.cover{width:min(100%,432px);aspect-ratio:3/4;margin:0;background:#fbf9f1;color:#24382f;border:1px solid #d9dbd1;box-shadow:0 2px 3px #2632220a;display:flex;flex-direction:column;padding:30px 32px;position:relative;overflow:hidden}
.cover-top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.03em;border-top:2px solid #24382f;padding-top:10px}
.cover-title{font-size:clamp(32px,4.4vw,62px);font-weight:600;line-height:1.12;letter-spacing:-3px;margin:42px 0 0}
.cover-art{width:100%;flex:1;min-height:100px;margin:28px 0 22px}
.cover-footer{font-size:10px;display:flex;justify-content:space-between;border-top:1px solid #a4afa1;padding-top:11px}
.review-notes{border-left:1px solid var(--line);padding:24px 20px}
.review-notes h3{font-size:12px;margin:0 0 22px;font-weight:600}
.note-label{font-size:11px;color:var(--muted);margin-bottom:8px}
.note{font-size:13px;line-height:1.85;margin:0}
.action-details{margin-top:26px;font-size:12px}
.action-details summary{display:flex;align-items:center;justify-content:center;min-height:38px;border:1px solid #a6aea2;border-radius:3px;background:#fff;font-weight:600;list-style:none}
.action-details summary::-webkit-details-marker{display:none}
.action-details[open] summary{background:#edf0e9}
.action-copy{font-size:12px;color:#60695d;line-height:1.8;margin:14px 0 0}
.memo-label{display:block;font-size:11px;margin:16px 0 7px;color:var(--muted)}
.memo{display:block;width:100%;min-height:126px;resize:vertical;border:1px solid #cbd0c7;border-radius:3px;padding:9px;font-family:inherit;font-size:12px;line-height:1.7;background:#fff;color:var(--ink)}
@media(min-width:1600px){.canvas{padding:48px}.cover{width:470px}}
@media(max-width:1100px) and (min-width:761px){.workspace{grid-template-columns:250px minmax(0,1fr)}.review-body{grid-template-columns:minmax(0,1fr)}.review-notes{border-left:0;border-top:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:16px 24px}.review-notes h3,.note-label{display:none}.action-details{margin:0 0 0 auto}.action-details summary{padding:0 20px}.canvas{padding:30px}.cover{width:370px}.cover-title{font-size:48px}}
@media(max-width:760px){
 .appbar{height:48px;padding:0 18px;gap:20px}.brand{font-size:16px}.app-location{padding-left:18px}
 .workspace{display:block;min-height:calc(100vh - 48px)}.project-list{padding:21px 0 0;border-right:0;border-bottom:1px solid var(--line)}
 .list-heading{padding:0 18px 14px}.project{padding:13px 18px}.project-top{margin-bottom:5px}.project h2{font-size:13px}.project-meta{font-size:11px}.project-task{display:none}
 .overview{margin:0 18px;padding:8px 0;border-top:1px solid var(--line)}.overview dl{margin-bottom:14px}
 .project-header{padding:21px 18px;min-height:96px;gap:12px}.project-header h2{font-size:19px}.project-info{font-size:11px;gap:12px}.review-state{font-size:11px;gap:5px}
 .review-body{display:flex;flex-direction:column}.document-bar{height:43px;padding:0 18px}.canvas{padding:25px 24px}.cover{width:min(100%,300px);padding:22px}.cover-title{font-size:42px;margin-top:30px;letter-spacing:-2px}.cover-top,.cover-footer{font-size:8px}.cover-art{margin:20px 0 18px}
 .review-notes{padding:20px 18px 28px;border-left:0;border-top:1px solid var(--line)}.review-notes h3{margin-bottom:14px}.note-label{display:none}.action-details{margin-top:16px}.action-details summary{min-height:44px}
}
</style>
</head>
<body data-review-label="프로젝트 목록과 표지 검토">
<header class="appbar" data-review-key="appbar">
 <div class="brand" data-review-key="brand">fieldwork</div>
 <span class="app-location" data-review-key="app-location">프로젝트</span>
</header>
<div class="workspace" data-review-key="workspace">
 <aside class="project-list" data-review-key="project-list" aria-label="최근 프로젝트">
  <div class="list-heading" data-review-key="list-heading"><h1 data-review-key="list-title">최근 프로젝트</h1><span data-review-key="list-count">3</span></div>
  <article class="project selected" data-review-key="row-brand" aria-label="브랜드 가이드, 선택됨">
   <div class="project-top" data-review-key="brand-heading"><span class="status-mark" aria-hidden="true"></span><h2 data-review-key="brand-name">브랜드 가이드</h2></div>
   <div class="project-meta" data-review-key="brand-meta"><span data-review-key="brand-status">검토 대기</span><span data-review-key="brand-owner">김민서</span><span class="date" data-review-key="brand-date">10.08</span></div>
   <p class="project-task" data-review-key="brand-task">표지 시안 검토</p>
  </article>
  <article class="project" data-review-key="row-web">
   <div class="project-top" data-review-key="web-heading"><span class="status-mark" aria-hidden="true"></span><h2 data-review-key="web-name">웹사이트 개편</h2></div>
   <div class="project-meta" data-review-key="web-meta"><span data-review-key="web-status">진행 중</span><span data-review-key="web-owner">이도윤</span><span class="date" data-review-key="web-date">10.12</span></div>
  </article>
  <article class="project" data-review-key="row-product">
   <div class="project-top" data-review-key="product-heading"><span class="status-mark" aria-hidden="true"></span><h2 data-review-key="product-name">제품 소개서</h2></div>
   <div class="project-meta" data-review-key="product-meta"><span data-review-key="product-status">진행 중</span><span data-review-key="product-owner">박지우</span><span class="date" data-review-key="product-date">10.14</span></div>
  </article>
  <details class="overview" data-review-key="overview">
   <summary data-review-key="overview-toggle">전체 현황</summary>
   <dl data-review-key="metrics">
    <div data-review-key="metric-active"><dt>진행 중 프로젝트</dt><dd>12</dd></div>
    <div data-review-key="metric-review"><dt>검토 대기</dt><dd>4</dd></div>
    <div data-review-key="metric-done"><dt>이번 주 완료</dt><dd>8</dd></div>
   </dl>
  </details>
 </aside>
 <main class="review" data-review-key="main">
  <header class="project-header" data-review-key="project-header">
   <div data-review-key="project-identity"><h2 data-review-key="title">브랜드 가이드</h2><div class="project-info" data-review-key="project-info"><span data-review-key="selected-owner">담당자<b>김민서</b></span><span data-review-key="selected-date">기한<b>10.08</b></span></div></div>
   <span class="review-state" data-review-key="selected-status">검토 대기</span>
  </header>
  <div class="review-body" data-review-key="review-body">
   <section class="document" data-review-key="document" aria-label="표지 시안 미리보기">
    <div class="document-bar" data-review-key="document-bar"><span data-review-key="document-title">표지 시안</span><span data-review-key="document-disclosure">예시 표지</span></div>
    <div class="canvas" data-review-key="canvas">
     <figure class="cover" data-review-key="cover" aria-label="브랜드 가이드 예시 표지">
      <div class="cover-top" data-review-key="cover-top"><span>FIELDWORK</span><span>브랜드 가이드</span></div>
      <div class="cover-title" data-review-key="cover-title">브랜드<br>가이드</div>
      <svg class="cover-art" viewBox="0 0 320 190" aria-hidden="true" data-review-ignore>
       <path fill="#345563" d="M0 0h72v190H0zM82 0h238v46H82zM82 58h178v46H82z"/>
       <path fill="#bcc8cc" d="M82 116h178v74H82zM272 58h48v132h-48z"/>
      </svg>
      <div class="cover-footer" data-review-key="cover-footer"><span>IDENTITY / APPLICATION</span><span>FIELDWORK</span></div>
     </figure>
    </div>
   </section>
   <aside class="review-notes" data-review-key="review-notes" aria-label="검토 요청">
    <h3 data-review-key="notice-title">검토 요청</h3>
    <div class="note-label" data-review-key="notice-project">브랜드 가이드</div>
    <p class="note" data-review-key="notice-copy">표지 시안을<br>검토해 주세요.</p>
    <details class="action-details" data-review-key="review-action">
     <summary data-review-key="review-button">검토 메모 작성</summary>
     <label class="memo-label" for="review-memo" data-review-key="memo-label">표지에 대한 의견</label>
     <textarea class="memo" id="review-memo" data-review-key="review-memo"></textarea>
    </details>
   </aside>
  </div>
 </main>
</div>
</body>
</html>
