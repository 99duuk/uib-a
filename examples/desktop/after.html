<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fieldwork · 프로젝트 개요</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#22292e;--muted:#647078;--line:#e2e6e8;--accent:#345563}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sidebar{position:fixed;inset:0 auto 0 0;width:204px;background:#f8f9f9;border-right:1px solid var(--line);padding:21px 14px;display:flex;flex-direction:column}
.brand{padding:0 12px 30px;font-size:18px;font-weight:750;letter-spacing:-.7px;color:var(--accent)}
.nav-list{display:flex;flex-direction:column;gap:3px}
.nav-list span{display:flex;align-items:center;gap:11px;min-height:38px;padding:8px 12px;font-size:13px;color:var(--muted);border-radius:4px}
.nav-list .active{background:#e9edef;color:var(--ink);font-weight:600}
.nav-list svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.5;fill:none}
.workspace{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
main{margin-left:204px}
.topbar{height:54px;border-bottom:1px solid var(--line);padding:0 32px;display:flex;align-items:center;font-size:12px;color:var(--muted)}
.topbar .separator{margin:0 12px;color:#b4bcc1}
.content{max-width:1260px;margin:0 auto;padding:32px 36px}
h1{font-size:26px;line-height:1.35;letter-spacing:-.8px;margin:0;font-weight:650}
.summary{display:flex;gap:48px;margin:25px 0 28px;padding:0 0 25px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.summary div{display:flex;align-items:baseline;gap:12px}
.summary dt{font-size:13px;color:var(--muted)}
.summary dd{margin:0;font-size:23px;font-weight:600;letter-spacing:-.6px}
.review-row{display:flex;gap:24px;align-items:center;padding:17px 20px;border-left:3px solid var(--accent);background:#f4f6f7;margin-bottom:34px}
.review-info{flex:1;min-width:0}
.review-info h2{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 5px}
.review-info p{margin:0;font-size:14px;line-height:1.6}
.review-info p strong{font-weight:600;margin-right:12px}
.primary{background:var(--accent);color:white;border:1px solid var(--accent);border-radius:4px;min-height:36px;padding:7px 13px;font-size:12px;font-weight:600;white-space:nowrap}
.list-heading{display:flex;align-items:baseline;gap:9px;padding-bottom:17px}
.list-heading h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.3px}
.list-heading span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
col.name{width:43%}col.owner{width:18%}col.status{width:23%}col.date{width:16%}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:11px 16px;background:#f8f9f9;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
td{height:62px;padding:16px;border-bottom:1px solid #edf0f1;font-size:13px;vertical-align:middle}
td:first-child{font-weight:550;font-size:14px}
td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.project-icon{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;width:25px;height:28px;margin-right:12px;border:1px solid #cbd3d7;border-radius:3px;color:#819099;background:#fff}
.project-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.3}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;flex:none;border:1.5px solid #6b8591;border-radius:50%}
.status.review::before{border-color:#a37d37;background:#a37d37}
.mobile-brand{display:none}
@media(max-width:800px){
 .sidebar{display:none}main{margin:0}.topbar{height:52px;padding:0 20px}.mobile-brand{display:inline;font-weight:700;color:var(--accent)}.desktop-brand{display:none}
 .content{padding:25px 20px}h1{font-size:24px}
 .summary{gap:0;justify-content:space-between;margin:21px 0 23px;padding-bottom:21px}
 .summary div{flex-direction:column;gap:5px}.summary dt{font-size:11px}.summary dd{font-size:22px}
 .review-row{gap:12px;align-items:flex-start;flex-direction:column;padding:14px 16px;margin-bottom:28px}
 .review-info p{font-size:13px}.review-info p strong{display:block;margin-right:0}.primary{min-height:38px}
 .list-heading{padding-bottom:13px}.list-heading h2{font-size:15px}
 table,tbody{display:block}thead,colgroup{display:none}tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:16px 0;border-top:1px solid var(--line)}
 td{display:block;padding:0;border:0;height:auto;font-size:12px}
 td:first-child{grid-column:1;grid-row:1;font-size:14px;min-width:0;overflow-wrap:anywhere}
 td:nth-child(2){grid-column:1;grid-row:2;color:var(--muted);padding-left:0}
 td:nth-child(2)::before{content:"담당자 ";color:#7e898f}
 td:nth-child(3){grid-column:2;grid-row:1}
 td:nth-child(4){grid-column:2;grid-row:2;color:var(--muted)}
 td:nth-child(4)::before{content:"기한 ";color:#7e898f}
 .project-icon{display:none}.status{font-size:11px}
}
</style>
</head>
<body data-review-label="프로젝트 개요 전체">
<aside class="sidebar" data-review-key="sidebar">
  <div class="brand" data-review-key="brand">fieldwork</div>
  <nav class="nav-list" aria-label="업무 메뉴" data-review-key="navigation">
    <span class="active" aria-current="page" data-review-key="nav-overview"><svg viewBox="0 0 20 20" aria-hidden="true" data-review-ignore><path d="M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3zM12 12h5v5h-5z"/></svg>프로젝트 개요</span>
    <span data-review-key="nav-projects"><svg viewBox="0 0 20 20" aria-hidden="true" data-review-ignore><path d="M2.5 5h6l2-2h7v14h-15z"/></svg>프로젝트</span>
    <span data-review-key="nav-inbox"><svg viewBox="0 0 20 20" aria-hidden="true" data-review-ignore><path d="M3 3h14v14H3zM3 11h4l1 3h4l1-3h4"/></svg>받은 편지함</span>
    <span data-review-key="nav-team"><svg viewBox="0 0 20 20" aria-hidden="true" data-review-ignore><circle cx="8" cy="6" r="3"/><path d="M2 17v-2a6 6 0 0 1 12 0v2M14 3a3 3 0 0 1 0 6M15 12a4 4 0 0 1 3 4v1"/></svg>팀 멤버</span>
  </nav>
  <div class="workspace" data-review-key="workspace">샘플 워크스페이스</div>
</aside>
<main data-review-key="main">
  <header class="topbar" data-review-key="topbar"><span class="desktop-brand" data-review-key="workspace-name">워크스페이스</span><span class="mobile-brand" data-review-key="mobile-brand">fieldwork</span><span class="separator" aria-hidden="true">/</span><span data-review-key="breadcrumb">프로젝트 개요</span></header>
  <div class="content" data-review-key="content">
    <h1 data-review-key="title">프로젝트 개요</h1>
    <dl class="summary" data-review-key="metrics">
      <div data-review-key="metric-active"><dt data-review-key="active-title">진행 중 프로젝트</dt><dd data-review-key="active-value">12</dd></div>
      <div data-review-key="metric-review"><dt data-review-key="review-title">검토 대기</dt><dd data-review-key="review-value">4</dd></div>
      <div data-review-key="metric-done"><dt data-review-key="done-title">이번 주 완료</dt><dd data-review-key="done-value">8</dd></div>
    </dl>
    <section class="review-row" data-review-key="notice" aria-labelledby="review-heading">
      <div class="review-info" data-review-key="notice-content">
        <h2 id="review-heading" data-review-key="notice-title">오늘 확인할 일</h2>
        <p data-review-key="notice-copy"><strong>브랜드 가이드</strong>표지 시안을 검토해 주세요.</p>
      </div>
      <button class="primary" data-review-key="review-button">표지 시안 검토</button>
    </section>
    <section data-review-key="project-panel">
      <div class="list-heading" data-review-key="list-heading"><h2 data-review-key="list-title">최근 프로젝트</h2><span data-review-key="list-count">3개</span></div>
      <table data-review-key="projects" aria-label="최근 프로젝트 목록">
        <colgroup><col class="name"><col class="owner"><col class="status"><col class="date"></colgroup>
        <thead data-review-key="table-head"><tr><th scope="col">프로젝트</th><th scope="col">담당자</th><th scope="col">상태</th><th scope="col">기한</th></tr></thead>
        <tbody>
          <tr data-review-key="row-brand"><td data-review-key="brand-name"><span class="project-icon" aria-hidden="true"><svg viewBox="0 0 16 16" data-review-ignore><path d="M4 2h6l2 2v10H4zM6 7h4M6 10h4"/></svg></span>브랜드 가이드</td><td data-review-key="brand-owner">김민서</td><td data-review-key="brand-status"><span class="status review">검토 대기</span></td><td data-review-key="brand-date">10.08</td></tr>
          <tr data-review-key="row-web"><td data-review-key="web-name"><span class="project-icon" aria-hidden="true"><svg viewBox="0 0 16 16" data-review-ignore><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2 6h12"/></svg></span>웹사이트 개편</td><td data-review-key="web-owner">이도윤</td><td data-review-key="web-status"><span class="status">진행 중</span></td><td data-review-key="web-date">10.12</td></tr>
          <tr data-review-key="row-product"><td data-review-key="product-name"><span class="project-icon" aria-hidden="true"><svg viewBox="0 0 16 16" data-review-ignore><path d="M4 2h6l2 2v10H4zM6 7h4M6 10h4"/></svg></span>제품 소개서</td><td data-review-key="product-owner">박지우</td><td data-review-key="product-status"><span class="status">진행 중</span></td><td data-review-key="product-date">10.14</td></tr>
        </tbody>
      </table>
    </section>
  </div>
</main>
</body>
</html>
