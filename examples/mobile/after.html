<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morrow · 나의 서재</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#242b27;--muted:#666d68;--line:#e1e5e1;--green:#387159}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--green);outline-offset:4px}
.shell{max-width:480px;margin:auto;padding:0 24px 94px}
.masthead{height:58px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.brand{font-size:17px;font-weight:750;letter-spacing:-.6px;color:var(--green)}
.page-heading{padding:27px 0 25px}
h1{font-size:28px;line-height:1.25;letter-spacing:-1px;margin:0 0 9px;font-weight:700}
.summary{margin:0;color:var(--muted);font-size:13px}
h2{font-size:14px;line-height:1.5;margin:0;font-weight:650}
.section-label{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.book-row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:22px;align-items:center}
.cover{width:104px;height:148px;border:1px solid #aebba4;background:#d7ddcc;padding:16px 12px;color:#25392c;display:flex;flex-direction:column;justify-content:space-between;box-shadow:2px 2px 0 #f0f0e9}
.cover b{font-size:19px;line-height:1.35;font-weight:650;letter-spacing:-.8px}
.cover small{font-size:9px;line-height:1.4;letter-spacing:.2px}
.book-info{min-width:0}
.book-info h3{font-size:18px;line-height:1.4;letter-spacing:-.5px;margin:0 0 22px}
.position{font-size:13px;margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
.position strong{font-size:17px;color:var(--ink);font-weight:650}
.progress-track{height:3px;background:#e7ebe6;margin-top:9px;overflow:hidden}
.progress-fill{width:53.333%;height:100%;background:var(--green)}
.primary{display:block;width:100%;border:1px solid var(--green);border-radius:4px;background:var(--green);color:#fff;font-size:14px;font-weight:600;min-height:46px;margin-top:22px}
.next-section{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.next-book{display:flex;gap:16px;align-items:center;margin-top:18px}
.next-cover{width:55px;height:77px;flex:none;background:#e7d9bd;border:1px solid #cdbd9d;color:#59472e;display:flex;align-items:center;padding:8px;font-size:11px;line-height:1.4;font-weight:600}
.next-title{font-size:15px;font-weight:600;letter-spacing:-.3px}
.navigation{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;border-top:1px solid var(--line);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
.navigation button{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;font-size:11px;min-height:65px;padding:11px 30px 9px;color:var(--muted)}
.navigation button[aria-current]{color:var(--green);font-weight:650}
.navigation svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.65}
.modal{display:none;position:fixed;inset:0;background:#161d194d;z-index:5;align-items:center;justify-content:center;padding:24px}
.confirmed .modal{display:flex}
.dialog{width:100%;max-width:340px;background:white;border-radius:8px;padding:24px;box-shadow:0 12px 40px #0002}
.dialog h2{font-size:20px;line-height:1.4;letter-spacing:-.6px;margin:0 0 12px}
.dialog p{color:var(--muted);font-size:14px;line-height:1.7;margin:0}
.dialog .primary{margin-top:24px}
.cancel{display:block;width:100%;min-height:44px;border:0;background:transparent;color:var(--muted);margin-top:4px;font-size:13px}
@media(max-width:350px){.shell{padding-right:20px;padding-left:20px}.book-row{gap:16px;grid-template-columns:92px minmax(0,1fr)}.cover{width:92px;height:132px}.book-info h3{font-size:16px}.navigation button{padding-left:25px;padding-right:25px}}
</style>
</head>
<body data-review-label="서재 전체">
<main class="shell" data-review-key="main">
  <header class="masthead" data-review-key="header"><strong class="brand" data-review-key="wordmark">morrow</strong></header>
  <div class="page-heading" data-review-key="page-heading">
    <h1 data-review-key="title">나의 서재</h1>
    <p class="summary" data-review-key="summary">읽고 있는 책 1권 · 읽은 책 7권</p>
  </div>
  <section data-review-key="reading" data-review-label="읽고 있는 책과 이어 읽기">
    <div class="section-label" data-review-key="reading-heading"><h2 data-review-key="reading-title">읽고 있는 책</h2><span class="count" data-review-key="reading-count">1</span></div>
    <div class="book-row" data-review-key="current-book">
      <div class="cover" data-review-key="cover" role="img" aria-label="조용한 시간들 표지">
        <b data-review-key="cover-title">조용한<br>시간들</b>
        <small data-review-key="cover-original-title">THE QUIET HOURS</small>
      </div>
      <div class="book-info" data-review-key="reading-content">
        <h3 data-review-key="book-title">조용한 시간들</h3>
        <p class="position" data-review-key="progress"><strong>128</strong> / 240쪽</p>
        <div class="progress-track" data-review-key="progress-track" role="progressbar" aria-label="읽은 페이지" aria-valuenow="128" aria-valuemin="0" aria-valuemax="240"><div class="progress-fill"></div></div>
      </div>
    </div>
    <button class="primary" data-review-key="continue" data-review-entry="library-confirm-mobile">이어서 읽기</button>
  </section>
  <section class="next-section" data-review-key="recommendation">
    <h2 data-review-key="recommend-title">다음에 읽을 책</h2>
    <div class="next-book" data-review-key="next-book">
      <div class="next-cover" data-review-key="next-cover" role="img" aria-label="도시를 걷는 마음 표지">도시를<br>걷는<br>마음</div>
      <strong class="next-title" data-review-key="next-title">도시를 걷는 마음</strong>
    </div>
  </section>
</main>
<nav class="navigation" aria-label="주 메뉴" data-review-key="navigation">
  <button aria-current="page" data-review-key="nav-library"><svg viewBox="0 0 24 24" aria-hidden="true" data-review-ignore><path d="M3 4.5h6a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H3zM21 4.5h-6a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h6z"/></svg>서재</button>
  <button data-review-key="nav-discover"><svg viewBox="0 0 24 24" aria-hidden="true" data-review-ignore><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>발견</button>
  <button data-review-key="nav-journal"><svg viewBox="0 0 24 24" aria-hidden="true" data-review-ignore><path d="M6 3h13v18H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM8 8h7M8 12h7M8 16h4"/></svg>기록</button>
</nav>
<div class="modal" data-review-key="modal-backdrop">
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirmation-title" data-review-key="confirmation">
    <h2 id="confirmation-title" data-review-key="confirm-title">이어서 읽기</h2>
    <p data-review-key="confirm-copy">조용한 시간들<br>128쪽에서 시작합니다.</p>
    <button class="primary" data-review-key="confirm-button">읽기 시작</button>
    <button class="cancel" data-review-key="cancel" data-review-entry="library-default-mobile">서재로 돌아가기</button>
  </section>
</div>
</body>
</html>
